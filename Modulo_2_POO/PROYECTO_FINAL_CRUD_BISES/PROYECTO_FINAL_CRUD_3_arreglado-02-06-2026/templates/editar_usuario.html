<h1>Editar usuario</h1>

<form method="POST">
    Usuario: <input name="username" value="{{ usuario.username }}"><br>
    Password: <input name="password" value="{{ usuario.password }}"><br>
    Rol: <input name="rol_id" value="{{ usuario.rol_id }}"><br>

    <button type="submit">Guardar</button>
</form>
