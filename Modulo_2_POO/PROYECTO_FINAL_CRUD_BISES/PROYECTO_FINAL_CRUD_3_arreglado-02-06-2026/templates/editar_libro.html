<!DOCTYPE html>
<html lang="es">
<head>
    <title>Editar libro</title>
</head>
<body>

    <h1>Editar libro</h1>

    <form method="POST">

        <label>Título:</label><br>
        <input type="text" name="titulo" value="{{ libro.titulo }}"><br><br>

        <label>Autor:</label><br>
        <input type="text" name="autor" value="{{ libro.autor }}"><br><br>

        <button type="submit">Guardar cambios</button>

    </form>

</body>
</html>
