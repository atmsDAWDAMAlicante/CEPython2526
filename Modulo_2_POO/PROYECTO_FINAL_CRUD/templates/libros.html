<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <style>
        table, th, td {border: 1px solid black;border-collapse: collapse; padding: 5px;}
        body {font-family: Arial;}
        a {margin-right: 10px;}
    </style>
</head>
<body>

    <h1>Gestión de Biblioteca</h1>

    <hr>

    <p>Usuario conectado: {{ session["usuario"] }}</p>

    <a href="/logout">Cerrar sesión</a>
    <br><br>

    <a href="/nuevo_libro">Nuevo libro</a>


    <a href="/libros">Ver libros</a> |
    <a href="/nuevo_libro">Añadir libro</a> |
    <a href="/login">Login</a>

    <hr>

    <h2>Listado de libros</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>Acciones</th>
        </tr>

        {% for libro in libros %}
        <tr>
            <td>{{ libro.id }}</td>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.autor }}</td>
            <td>
                <a href="/editar_libro/{{ libro.id }}">Editar</a>
                |
                <a href="/eliminar_libro/{{ libro.id }}">
                    Eliminar
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
